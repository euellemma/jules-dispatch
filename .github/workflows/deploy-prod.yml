name: Deploy to Prod

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  # ─── Quality gate: CI must pass before prod deploy ──────────────────────────
  ci-check:
    name: CI Must Pass
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ job.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci

      - name: Type check root + convex
        run: npx tsc --noEmit

      - name: Type check web
        run: cd web && npx tsc --noEmit

      - name: Lint root + convex
        run: npm run lint

      - name: Lint web
        run: cd web && npm run lint

      - name: Build web
        run: npm run build

  # ─── Deploy: only after CI passes ──────────────────────────────────────────
  deploy-prod:
    name: Deploy to Prod
    needs: ci-check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.CONVEX_PROD_SITE_URL }}/settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex backend to prod
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOYMENT: ${{ vars.CONVEX_PROD_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}

      - name: Build web
        run: npm run build

      - name: Upload static files to prod
        run: npx @convex-dev/static-hosting upload --dist ./web/dist --deployment ${{ vars.CONVEX_PROD_DEPLOYMENT }} --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          CONVEX_URL: ${{ vars.CONVEX_PROD_URL }}

      - name: Verify deployment
        run: |
          sleep 10
          curl -sf "${{ vars.CONVEX_PROD_SITE_URL }}/api/health" || exit 1
          echo "Production deployment verified"

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployed successfully"
          echo "Backend: ${{ vars.CONVEX_PROD_URL }}"
          echo "Settings: ${{ vars.CONVEX_PROD_SITE_URL }}/settings"

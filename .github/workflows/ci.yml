name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: Type check (fastest, fail first) ───────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci

      - name: Type check root + convex
        run: npx tsc --noEmit

      - name: Type check web
        run: cd web && npx tsc --noEmit

  # ─── Stage 2: Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci

      - name: Lint root + convex
        run: npm run lint

      - name: Lint web
        run: cd web && npm run lint

  # ─── Stage 3: Build ─────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          cd web && npm ci

      - name: Build web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ─── Stage 4: Smoke test (against dev deployment) ────────────────────────────
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Health check (dev deployment)
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${{ vars.CONVEX_DEV_DEPLOYMENT }}.convex.site/api/health" > /dev/null 2>&1; then
              echo "Dev deployment is healthy"
              exit 0
            fi
            echo "Waiting for dev deployment... ($i/30)"
            sleep 5
          done
          echo "Dev deployment did not become healthy"
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
